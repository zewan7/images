version: '3'

services:
  backend:
    build: ./backend
    image: my-backend:v1
    ports:
      - "8301:8301"
    volumes:
      - ./backend:/app
    networks:
      - app-network

  frontend:
    build: ./frontend
    image: my-frontend:v1
    ports:
      - "8300:8300"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html  # 挂载构建产物
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
